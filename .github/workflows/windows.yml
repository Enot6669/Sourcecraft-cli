name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Exercise the Studio interface
        run: node tests/desktop-smoke.cjs
      - name: Install and open SourceCraft Studio
        shell: pwsh
        run: |
          $installer = (Get-ChildItem 'release/*.exe' | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'sourcecraft-studio-installed'
          $install = Start-Process -FilePath $installer -ArgumentList "/S /D=$destination" -PassThru -Wait -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer failed (code $($install.ExitCode))." }
          $exe = (Resolve-Path (Join-Path $destination 'SourceCraft Studio.exe')).Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Studio exited before opening a window (code $($process.ExitCode))." }
              if ($process.MainWindowTitle -eq 'SourceCraft Studio') { break }
            } while ((Get-Date) -lt $deadline)
            if ($process.MainWindowTitle -ne 'SourceCraft Studio') { throw 'The installed Studio did not open.' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: SourceCraft-Studio-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
