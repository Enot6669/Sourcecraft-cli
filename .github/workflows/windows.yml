name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Check packaged application opens
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'release/win-unpacked/SourceCraft Studio.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Studio exited before opening a window (code $($process.ExitCode))." }
              if ($process.MainWindowTitle -eq 'SourceCraft Studio') { break }
            } while ((Get-Date) -lt $deadline)
            if ($process.MainWindowTitle -ne 'SourceCraft Studio') { throw 'Studio did not open its main window.' }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: SourceCraft-Studio-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
